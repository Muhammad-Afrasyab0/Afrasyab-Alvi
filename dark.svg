<svg xmlns="http://www.w3.org/2000/svg"
     width="1180" height="610" viewBox="0 0 1180 610"
     role="img"
     aria-label="Muhammad Afrasyab — Software and Web Developer profile"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".55" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>

    <radialGradient id="ambient" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#0E7490" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#4C1D95" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity=".045"/>
    </pattern>

    <pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#67E8F9" fill-opacity=".08"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <clipPath id="portraitClip">
      <rect x="54" y="136" width="376" height="306" rx="18"/>
    </clipPath>
  </defs>

  <!-- Outer frame -->
  <rect x="7" y="7" width="1166" height="596" rx="24"
        fill="url(#bg)" stroke="#334155" stroke-opacity=".75"/>
  <rect x="7" y="7" width="1166" height="596" rx="24" fill="url(#ambient)"/>
  <rect x="7" y="7" width="1166" height="596" rx="24" fill="url(#grid)"/>

  <!-- Ambient light -->
  <circle cx="180" cy="220" r="160" fill="#06B6D4" fill-opacity=".055" filter="url(#soft)">
    <animate attributeName="opacity" values=".5;1;.5" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="970" cy="470" r="180" fill="#7C3AED" fill-opacity=".055" filter="url(#soft)">
    <animate attributeName="opacity" values="1;.45;1" dur="10s" repeatCount="indefinite"/>
